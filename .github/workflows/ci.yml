# Run the test suite on every pull request, and on main.
#
# checkout and setup-node are pinned to v7: v4 targets the Node 20 runtime,
# which the runners now force onto Node 24 with a deprecation warning on every
# run. v7 is built for node24. This project has no lockfile and no
# packageManager field, so setup-node's automatic caching (added in v5) stays
# dormant — with either, it would try to cache dependencies that do not exist.
#
# pages.yml also runs `npm test` before publishing, but Playwright is not
# installed there, so the browser tests skip themselves silently — the most
# valuable coverage in this repo never ran in CI. The `browser` job below is
# where they actually run.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor package.json claims, so it is tested rather than
        # asserted; 24 is where the runners themselves are heading.
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # The project has no dependencies, so there is nothing to install.
      - name: Run tests
        run: npm test

      - name: The site still builds
        run: npm run site

      # The planner page is published to a public site and talks to a Supabase
      # project whose other tables are readable and writable by `anon`. A key
      # committed anywhere here would expose them, so fail loudly rather than
      # rely on nobody pasting one in. test/ is excluded: it asserts on these
      # very patterns.
      - name: No API key anywhere in the repo
        if: matrix.node == '22'
        run: |
          # The single-character brackets stop this line from matching itself
          # while leaving the regex exactly as strict. Excluding this file
          # instead would leave a blind spot in the one place a key gets pasted
          # by accident.
          pattern='eyJhbGci[O]i|sb_publisha[b]le_|sb_secr[e]t_|service_r[o]le|SUPABASE_SERVICE_R[O]LE_KEY'
          if grep -rInE "$pattern" . \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=test; then
            echo "::error::An API key looks committed. The planner page must ship an endpoint and never a key."
            exit 1
          fi
          echo "No API keys found."

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # --no-save: playwright is deliberately not a dependency of this project,
      # so the suite skips these tests for anyone who has not installed it.
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      # If Playwright were ever missing or broken, the suite would still pass by
      # skipping — which would quietly retire the two-cook sync test and every
      # end-to-end planner check. So run once, and insist nothing skipped.
      # pipefail matters: without it the pipe hides a failing npm test.
      - name: Run tests with a real browser
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/out.txt
          # Node <=22 prints "# skipped N"; Node 24 prints "ℹ skipped N". Match
          # both, or this guard quietly stops guarding on a newer runtime —
          # which is the exact failure it exists to catch.
          if grep -qE '^(#|ℹ)[[:space:]]+skipped[[:space:]]+[1-9]' /tmp/out.txt; then
            echo "::error::Browser tests skipped instead of running."
            grep -E 'skip' /tmp/out.txt | head -20
            exit 1
          fi
          echo "Nothing skipped."
