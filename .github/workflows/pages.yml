# Rebuild the recipe site from recipes/ and publish it to GitHub Pages.
#
# Enable once: Settings -> Pages -> Source: "GitHub Actions".
# After that, adding a file to recipes/ and pushing is the whole workflow.
name: Build and publish recipe cards

on:
  push:
    branches: [main]
    paths:
      - 'recipes/**'
      - 'src/**'
      - 'bin/**'
      - 'planner/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish before the next one starts; never cancel a publish midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

      - name: Build the site
        run: npm run site

      # v3 wrapped upload-artifact@v4, which the runners now force onto Node 24
      # with a deprecation warning; v5 wraps upload-artifact@v7. Note that from
      # v4 this action excludes dotfiles from the artifact unless
      # include-hidden-files is set — docs/ has none, and Pages serves the
      # artifact directly with no Jekyll step, so nothing here needs one.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
